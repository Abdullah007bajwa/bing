name: ghost_client
description: Military-grade end-to-end encrypted messaging app — no phone, no email, no traces.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Cryptography & Signal Protocol ─────────────────────────────────────────
  libsignal_protocol_dart: ^0.4.1-nullsafety.0  # Signal Double Ratchet + X3DH
  cryptography: ^2.7.0                  # AES-256-GCM, HKDF, PBKDF2
  crypto: ^3.0.3                        # SHA-256, SHA-512, HMAC
  pointycastle: ^3.9.1                  # Low-level crypto primitives
  convert: ^3.1.1                       # Base64 / hex encoding

  # ── Secure Storage (Android Keystore / iOS Secure Enclave) ─────────────────
  flutter_secure_storage: ^9.2.2

  # ── Local Encrypted Database ─────────────────────────────────────────────── 
  sqflite_sqlcipher: ^2.2.0            # SQLCipher AES-256 encrypted SQLite

  # ── Networking ──────────────────────────────────────────────────────────────
  web_socket_channel: ^3.0.1
  http: ^1.2.2

  # ── QR Code ─────────────────────────────────────────────────────────────────
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3               # MLKit / AVFoundation QR scanning

  # ── Supabase ─────────────────────────────────────────────────────────────────
  supabase_flutter: ^2.7.0

  # ── UI & UX ──────────────────────────────────────────────────────────────────
  flutter_animate: ^4.3.0
  google_fonts: ^6.2.1
  phosphor_flutter: ^2.1.0
  gap: ^3.0.1
  intl: ^0.19.0

  # ── Device Security ──────────────────────────────────────────────────────────
  flutter_windowmanager: ^0.2.0        # FLAG_SECURE — block screenshots (Android)
  local_auth: ^2.3.0                   # Biometric lock (Android / iOS)
  flutter_ringtone_player: ^4.0.0+4    # Play system notification sounds (Android/iOS)

  # ── Emergency call + location ───────────────────────────────────────────────
  url_launcher: ^6.3.0
  geolocator: ^12.0.0
  permission_handler: ^11.3.0

  # ── State Management ─────────────────────────────────────────────────────────
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # ── Media ────────────────────────────────────────────────────────────────────
  image_picker: ^1.1.2
  flutter_image_compress: ^2.1.0
  video_player: ^2.9.2

  # ── Utils ────────────────────────────────────────────────────────────────────
  uuid: ^4.5.1
  collection: ^1.18.0
  share_plus: ^12.0.1
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.2.2            # Biometric lock preference
  flutter_dotenv: ^5.1.0               # Environment variables
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^19.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.5
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/app_icon.png
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/images/app_icon.png

flutter_native_splash:
  color: "#000000"
  image: assets/images/app_icon.png
  android_12:
    color: "#000000"
    image: assets/images/app_icon.png
