org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=false

# Command-line `.\gradlew` uses JAVA_HOME / PATH (not Flutter's embedded JDK).
# Android Gradle Plugin 8.7+ requires JDK 17+. If `java -version` shows 1.8, uncomment
# and set this to a JDK 17+ install (Android Studio's JBR is a common choice):
# org.gradle.java.home=C:\\Program Files\\Android\\Android Studio\\jbr

# Gradle optimization flags
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Kotlin optimization
kotlin.incremental=true
kotlin.compiler.execution.strategy=in-process

# Android optimization
android.builder.sdkDownload=true
android.enableR8.fullMode=false

